name: Update data
run-name: "Update data (${{ inputs.mode || github.event_name }})"

on:
  schedule:
    - cron: "15 * * * *"          # stündlich: nur Rang/Ranked-Stats (HenrikDev), OPL aus dem Cache
    - cron: "0 22 * * *"          # täglich 22:00 UTC = 23:00 Uhr deutscher Winterzeit (Sommerzeit: 0:00 Uhr): OPL komplett
    # GitHub startet geplante Läufe oft einige Minuten verspätet
  workflow_dispatch:               # manuell (Webseite/Actions-Tab) oder per externem Cron-Dienst (mode=hourly/daily)
    inputs:
      mode:
        description: "quick = nur Tabelle, Matches + Rundendaten (wenige Minuten), manual = Liga/Team wie angegeben, hourly = nur Ranked-Stats, daily = OPL komplett"
        type: choice
        options: [manual, quick, hourly, daily]
        default: manual
      league:
        description: "Liga: 'all', Event-ID oder Standing-URL"
        default: "all"
      team:
        description: "Team-ID – nur dieses Team sofort komplett neu laden"
        default: ""
      add_league:
        description: "Neue Standing-URL dauerhaft hinzufügen (optional)"
        default: ""
      add_league_name:
        description: "Anzeigename der neuen Liga (optional)"
        default: ""
  push:
    branches: [main]
    paths: ["web/**", "build.py", "scout_core.py", "config/**", ".github/workflows/update.yml"]

permissions:
  contents: write      # Cache im Branch `data` speichern
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Zustand aus Branch `data` holen
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch -q --depth 1 origin data
            git archive FETCH_HEAD | tar -x -C state
          fi
          ls -la state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daten aktualisieren
        env:
          HENRIKDEV_API_KEY: ${{ secrets.HENRIKDEV_API_KEY }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          IN_MODE: ${{ inputs.mode }}
          IN_LEAGUE: ${{ inputs.league }}
          IN_TEAM: ${{ inputs.team }}
          IN_ADD: ${{ inputs.add_league }}
          IN_ADD_NAME: ${{ inputs.add_league_name }}
        run: |
          ARGS=(--state state --out _site)
          if [ "$EVENT" = "push" ]; then
            ARGS+=(--matches-only)                        # Code-Änderung: OPL-Matches nachladen + neu bauen (keine API)
          elif [ "$IN_MODE" = "quick" ]; then
            ARGS+=(--quick --league "${IN_LEAGUE:-all}" --round-requests 40)   # schnell: Tabelle, Matches, Rundendaten – keine Kader/Ränge
          elif [ "$IN_MODE" = "daily" ] || { [ "$EVENT" = "schedule" ] && [ "$CRON" = "0 22 * * *" ]; }; then
            ARGS+=(--budget-minutes 30 --round-requests 40)   # täglicher OPL-Crawl: Standings, Kader, Riot-IDs, Matches + Rundendaten
          elif [ "$IN_MODE" = "hourly" ] || [ "$EVENT" = "schedule" ]; then
            ARGS+=(--budget-minutes 30 --skip-opl --round-requests 8)   # stündlich: Ranked-Stats + ein paar Rundendaten
          else
            ARGS+=(--budget-minutes 40 --league "${IN_LEAGUE:-all}" --round-requests 250)
            [ -n "$IN_TEAM" ] && ARGS+=(--team "$IN_TEAM")
            [ -n "$IN_ADD" ] && ARGS+=(--add-league "$IN_ADD" --add-league-name "$IN_ADD_NAME")
          fi
          python build.py "${ARGS[@]}"

      - name: Zustand speichern
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd state
          [ -f cache.json ] || exit 0
          # immer nur ein einziger Commit (keine wachsende Historie)
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Daten $(date -u +'%Y-%m-%d %H:%M') UTC (${{ github.event_name }})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data

      # eigener Name pro Versuch, damit "Re-run jobs" nicht an zwei gleichnamigen Artefakten scheitert
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
